<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage books – BookBay Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/admin-books.js" defer></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container page">
    <h1>Manage books</h1>
    <div id="page-message" class="hidden"></div>

    <div class="admin-toolbar">
      <form id="admin-search-form" class="search" role="search">
        <input type="search" id="admin-search" placeholder="Search title or author" aria-label="Search books">
        <button type="submit" class="btn btn-outline">Search</button>
      </form>
      <button type="button" class="btn" id="add-book-button">+ Add book</button>
    </div>

    <!-- Add / edit form (hidden until needed) -->
    <section id="book-form-panel" class="panel hidden">
      <h2 id="book-form-title">Add a book</h2>
      <div id="form-message" class="hidden"></div>
      <form id="book-form" class="form" novalidate>
        <input type="hidden" id="book-id">
        <div class="form-row">
          <div>
            <label for="title">Title</label>
            <input type="text" id="title" maxlength="255" required>
          </div>
          <div>
            <label for="author">Author</label>
            <input type="text" id="author" maxlength="255" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="genre">Genre</label>
            <input type="text" id="genre" list="genre-list" maxlength="100" required>
            <datalist id="genre-list"></datalist>
          </div>
          <div>
            <label for="isbn">ISBN <span class="hint">(used for the cover image)</span></label>
            <input type="text" id="isbn" maxlength="17">
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="bookCondition">Condition</label>
            <select id="bookCondition" required>
              <option value="New">New</option>
              <option value="Like New">Used – Like New</option>
              <option value="Very Good">Used – Very Good</option>
              <option value="Good">Used – Good</option>
              <option value="Acceptable">Used – Acceptable</option>
            </select>
          </div>
          <div>
            <label for="price">Price (EGP)</label>
            <input type="number" id="price" min="0" max="100000" step="0.01" required>
          </div>
          <div>
            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" max="10000" step="1" required>
          </div>
        </div>
        <div id="condition-note-field" class="hidden">
          <label for="conditionNote">Condition note <span class="hint">What exactly is wrong with this copy?</span></label>
          <input type="text" id="conditionNote" maxlength="255" placeholder="e.g. Some highlighting in chapter 3">
        </div>
        <div>
          <label for="coverUrl">Cover image URL <span class="hint">(optional, must start with https://)</span></label>
          <input type="url" id="coverUrl" maxlength="500">
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" maxlength="2000"></textarea>
        </div>
        <div class="row-actions">
          <button type="submit" class="btn" id="save-book-button">Save book</button>
          <button type="button" class="btn btn-outline" id="cancel-book-button">Cancel</button>
        </div>
      </form>
    </section>

    <div class="table-wrap panel">
      <table>
        <thead>
          <tr><th>Book</th><th>Condition</th><th>Price</th><th>Stock</th><th></th></tr>
        </thead>
        <tbody id="books-table"></tbody>
      </table>
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="site-footer">
    <div class="container">BookBay Admin</div>
  </footer>
</body>
</html>
